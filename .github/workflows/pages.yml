name: Test and deploy Planto-Ride
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plato-ride-pages
  cancel-in-progress: false

jobs:
  website-and-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: planto_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: planto_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check browser booking and map logic
        run: |
          node --check website/dist/app.mjs
          node --check website/dist/maps.mjs
          node --check website/dist/client.mjs
          node --check website/dist/track.mjs
          node --check website/dist/pay.mjs
          node --check website/dist/companion.mjs
          node --test website/tests/*.test.mjs
      - name: Check transactional API
        working-directory: api
        run: |
          pip install -r requirements.txt
          python -m pytest tests -q
      - name: Check the same workflows on PostgreSQL
        working-directory: api
        env:
          TEST_POSTGRES_URL: postgresql://planto_test:local_ci_only@localhost:5432/planto_test
        run: python -m pytest tests -q

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck && npm test
        working-directory: mobile
      - name: Export Android, iOS and web bundles
        working-directory: mobile
        env:
          EXPO_OFFLINE: '1'
        run: npm run export

  deploy:
    needs: [website-and-api, mobile]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure optional browser Maps Embed API key
        env:
          MAPS_EMBED_KEY: ${{ vars.GOOGLE_MAPS_EMBED_API_KEY }}
          PLANTO_API_URL: ${{ vars.PLANTO_API_URL }}
        run: |
          node website/scripts/configure-maps.mjs
          node website/scripts/configure-api.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
